# agent-cli configuration: copy to ~/.config/agent-cli/config.toml
# ($XDG_CONFIG_HOME/agent-cli/config.toml, or the path in $AGENT_CLI_CONFIG).
# The binary carries this file: `agent-cli config example [DOMAIN]` prints it
# or one domain's section, and `agent-cli config` shows what was read.
#
# Each domain reads only its own section, so a mistake in one section breaks
# only that domain. AGENT_CLI_<SECTION>_<KEY> overrides any scalar key, for
# example AGENT_CLI_ADO_PROJECT=web. Run `agent-cli doctor` to check it all.
#
# Passwords and tokens go in this file too (`chmod 600` it), so one file holds
# every service. Any credential KEY can instead be KEY_env (a variable that
# holds it) or KEY_cmd (a command that prints it, such as `pass show NAME`),
# which lets many connections share one password.
#
# Every key below is commented out: uncomment the ones you need.

# [ado]
# Sign-in: a personal access token (pat, pat_env or pat_cmd), else
# AZURE_DEVOPS_EXT_PAT, else the Azure CLI's login (`az login`). org and
# project fall back to
# `az devops configure --defaults organization=... project=...`.
# org = "contoso"                        # or "https://dev.azure.com/contoso"
# project = ["web", "mobile"]            # where the work items live; one or a
#                                        # list, the first the default --project
# code_project = "web"                   # repos, PRs, pipelines; default: project
# team = ["web team", "mobile/apps"]     # or one; PROJECT/TEAM for another
#                                        # project's; `--iteration @current` needs it
# pat = "..."                            # or pat_env, pat_cmd

# [confluence]
# Confluence Data Center or Server, self-hosted; Cloud (*.atlassian.net) is not supported.
# Sign-in: a personal access token (your profile, Personal Access Tokens, at
# URL/plugins/personalaccesstokens/usertokens.action), sent as Bearer to URLs
# under url and nowhere else. Tokens can expire, and an admin can revoke them;
# `agent-cli doctor confluence` says when one stops working.
# url = "https://wiki.contoso.example"   # what the browser shows, context path
#                                        # included: https://contoso.example/confluence
# token = "..."                          # or token_env, token_cmd

# [azure]
# kv, acr, aks, aisearch, arm, net, lake and entra sign in with your `az login`; nothing is
# required. An empty or missing list means everything the login reaches; a
# list is an allowlist that also sets the order rows come in. Each takes a
# string or a list. Add the section (even empty) for `agent-cli doctor` to
# check Azure.
# subscriptions = ["00000000-0000-0000-0000-000000000000"]
# vaults = ["kv-contoso-dev", "kv-contoso-prod"]
# registries = "contosoacr"
# search_services = ["srch-contoso-prod", "srch-contoso-dev"]
# Each search service is called as its settings allow: a token when it takes
# roles (Search Index Data Reader to query, Reader for definitions and
# indexers, Search Service Contributor and Search Index Data Contributor to
# change them), else an admin key fetched from ARM per run, which needs
# Contributor or Search Service Contributor.
# storage_accounts = ["contosolake"]    # lake: accounts with a hierarchical
#                                        # namespace; reading data needs a data
#                                        # role (Storage Blob Data Reader) or ACLs,
#                                        # since Owner on the account grants none
# refresh = 300                          # seconds the resource inventory,
#                                        # subscriptions, api-versions, registry
#                                        # counts and index fields are cached;
#                                        # 0 = never
# parallel = 8                           # vaults, registries, repositories read at once

# [[k8s.scope]]
# One per cluster. `agent-cli aks cluster connect NAME` fetches the
# credentials and prints this block. --cluster takes the name (or the
# context) and --namespace one of the namespaces; each defaults when there is
# only one.
# name = "dev"
# context = "aks-contoso-dev"            # the kubeconfig context; the name when left out
# namespaces = ["web", "jobs"]           # or one string; left out: every namespace

# [sql]
# Where Oracle's Instant Client is, for Oracle connections only. Precedence:
# AGENT_CLI_SQL_ORACLE_CLIENT_DIR, then this key, then the system search
# (LD_LIBRARY_PATH, the library's run path, $ORACLE_HOME). A zip install on
# Linux also needs libaio, and its run path set (patchelf --set-rpath '$ORIGIN')
# or LD_LIBRARY_PATH. A leading ~/ is your home directory.
# oracle_client_dir = "~/.local/opt/oracle/instantclient_23_26"
#
# [[sql.connection]]
# name = "reporting"                     # what --conn takes; the only one is the default
# kind = "mssql"                         # or "oracle"
# host = "sql.contoso.example"
# port = 1433                            # default 1433 (mssql), 1521 (oracle)
# database = "contoso"                   # mssql only
# user = "app_reader"
# password = "..."                       # or password_env, password_cmd (run
#                                        # under the command's deadline, its
#                                        # trailing newline dropped)
# trust_cert = false                     # mssql only: accept a self-signed certificate
# encrypt = true                         # mssql only
#
# [[sql.connection]]
# name = "synapse"                       # Synapse serverless or Azure SQL
# kind = "mssql"
# host = "contoso-ws-ondemand.sql.azuresynapse.net"
# database = "master"
# auth = "az"                            # mssql only: your az login's Entra
#                                        # ID token, no user or password
#
# [[sql.connection]]
# name = "ledger"
# kind = "oracle"
# host = "ora.contoso.example"
# service = "LEDGER"                     # oracle only: the service name
# user = "app_reader"
# password_env = "CONTOSO_DB_PASSWORD"   # one password shared by connections
#
# Where an agent must not write, give it a login that can only read.

# [[redis.instance]]
# One per Redis an agent reads, usually one per project and environment:
# Azure Cache for Redis, Azure Managed Redis or self-hosted (Valkey too).
# Read only: agent-cli sends Redis nothing but reads. --instance takes the
# name (or the instance's host, URL or connection string); the only one is
# the default. Clusters are not supported.
# name = "orders-qa"                     # no colon: a diff side is INSTANCE:KEY
# host = "contoso-orders-qa.redis.cache.windows.net"
# auth = "az"                            # your az login's Entra ID token, sent only
#                                        # to *.redis.cache.windows.net and
#                                        # *.redis.azure.net; your account needs a
#                                        # data access policy that allows INFO,
#                                        # SLOWLOG and CLIENT LIST for the health
#                                        # commands
# user = "00000000-0000-4000-8000-000000000001"  # az only, optional: the Entra
#                                        # object id to sign in as; the token's own
#                                        # when left out
#
# [[redis.instance]]
# name = "orders-prod"                   # Azure Cache with an access key
# host = "contoso-orders.redis.cache.windows.net"
# port = 6380                            # default 6380 here, 10000 for
#                                        # *.redis.azure.net, else 6379
# tls = true                             # default true for Azure's hosts, else false
# password_cmd = "az redis list-keys -g rg-contoso -n contoso-orders --query primaryKey -o tsv"
#
# [[redis.instance]]
# name = "sessions-qa"                   # self-hosted
# host = "redis-qa.contoso.internal"
# user = "agent"                         # an ACL user; left out: default
# password_env = "REDIS_QA_PASSWORD"     # or password, password_cmd; none for an
#                                        # open dev server
# tls = true
# trust_cert = true                      # accept a self-signed certificate
# db = 0                                 # default 0
#
# Give it a user that holds only the reads agent-cli sends: the ACL
# "+@read -@dangerous +info +slowlog|get +client|list +client|id
# +client|setname +ping +select", or an Azure access policy like it.

# [[airflow.instance]]
# One per Apache Airflow server, 2.9+ or 3: which API it speaks (/api/v1 or
# /api/v2) is asked of the server. --instance takes the name; the only one is
# the default. Sign in with a username and password (Airflow 3: POST
# {base_url}/auth/token; Airflow 2: HTTP Basic, else its sign-in form when
# the server's auth_backends allow only session), or with a bearer token
# (token: Astro, Composer, MWAA). The credential goes only to URLs under
# base_url. An SSO user has no password the API takes: use a service
# account. An instance with no credential yet fails only itself.
# name = "dev"
# base_url = "https://airflow-dev.contoso.example"  # the webserver or API server,
#                                        # with any path prefix, without /api/v1
#                                        # or /api/v2; plain http only to localhost
# api = "v1"                             # optional: v1 (Airflow 2) or v2 (3);
#                                        # asked of the server when left out
# username = "agent"
# password = "..."                       # or password_env, password_cmd
# k8s_scope = "dev"                      # the [[k8s.scope]] its KubernetesExecutor
#                                        # pods run in: task get prints the pod
#                                        # as the id `k8s pod logs` takes
# k8s_namespace = "airflow"              # where those pods run; default "airflow"
# dags_repo = "airflow-dags:dags"        # REPO[:FOLDER] in Azure DevOps its DAG
#                                        # files deploy from: source get prints
#                                        # the id `ado file get` takes for them
#
# [[airflow.instance]]
# name = "qa"
# base_url = "https://airflow-qa.contoso.example"
# username = "agent"
# password = "..."
# k8s_scope = "qa"
#
# [[airflow.instance]]
# name = "prod"
# base_url = "https://airflow.contoso.example"
# username = "agent"
# password = "..."
# k8s_scope = "prod"

# [[controlm.instance]]
# One per BMC Control-M Enterprise Manager (on-prem), over its Automation API.
# --instance takes the name; the only one is the default. Sign in with the
# username and password of Control-M's web client (POST {base_url}/session/login,
# a session token per command), or with an API token (Enterprise Manager
# 9.0.21+, sent as x-api-key). The credential goes only to URLs under base_url.
# name = "prod"
# base_url = "https://ctm-em.contoso.example:8443/automation-api"
#                                        # the Automation API endpoint, with
#                                        # /automation-api
# username = "agent"
# password = "..."                       # or password_env, password_cmd
# token = "..."                          # instead of username and password:
#                                        # an API token (or token_env, token_cmd)
# utc_offset = "-05:00"                  # the Control-M/Servers' clock, which
#                                        # every time the API prints and takes
#                                        # is on; default +00:00
# [datadog]
# Also read as [dd]. The credential is a Datadog personal access token (sent
# as Authorization: Bearer), else the API + application key pair, each as
# KEY, KEY_env or KEY_cmd. With no key set at all: DD_ACCESS_TOKEN, else
# DD_API_KEY with DD_APP_KEY.
# The credential goes only to https://api.<site>.
# site = "datadoghq.eu"                  # default: DD_SITE, else datadoghq.com
# env = "prod"                           # default --env for logs, spans, services
# token = "..."                          # or token_cmd = "pup auth token" (reuses
#                                        # a pup login; run again after a 401)
# api_key = "..."                        # the fallback pair: both, each also
# app_key = "..."                        # as _env or _cmd
#
# The real guard is a token with read scopes only (logs_read_data,
# timeseries_query, metrics_read, monitors_read, events_read, apm_read,
# incident_read, hosts_read, slos_read, dashboards_read), plus
# monitors_downtime only where agents may mute. pup (Datadog's CLI) covers
# what dd does not; run it with PUP_READ_ONLY=1.
