# agent-cli configuration: copy to ~/.config/agent-cli/config.toml
# ($XDG_CONFIG_HOME/agent-cli/config.toml, or the path in $AGENT_CLI_CONFIG).
#
# Each domain reads only its own section, so a mistake in one section breaks
# only that domain. AGENT_CLI_<SECTION>_<KEY> overrides any scalar key, for
# example AGENT_CLI_ADO_PROJECT=web. Run `agent-cli doctor` to check it all.
#
# The sections below are placeholders; each domain settles its keys when it
# lands.

# [ado]
# org = "contoso"
# project = "web"
# code_project = "web"
# team = "web team"

# [azure]
# kv, acr and aks sign in with your `az login`; nothing here is required. An
# empty or missing list means everything the login reaches; a list is an
# allowlist that also sets the order rows come in. Each takes a string or a
# list. Add the section (even empty) for `agent-cli doctor` to check Azure.
# subscriptions = ["00000000-0000-0000-0000-000000000000"]
# vaults = ["kv-contoso-dev", "kv-contoso-prod"]
# registries = "contosoacr"
# refresh = 300                          # seconds the resource inventory and
#                                        # registry counts are cached; 0 = never
# parallel = 8                           # vaults, registries, repositories read at once

# [[k8s.scope]]
# One per cluster. `agent-cli aks cluster connect <cluster>` fetches the
# credentials and prints this block. --cluster takes the name and --namespace
# one of the namespaces; each defaults when there is only one.
# name = "dev"
# context = "aks-contoso-dev"            # the kubeconfig context; the name when left out
# namespaces = ["web", "jobs"]           # or one string; left out: every namespace

# [sql]
# Where Oracle's Instant Client is, for Oracle connections only. Precedence:
# AGENT_CLI_SQL_ORACLE_CLIENT_DIR, then this key, then the system search
# (LD_LIBRARY_PATH, the library's run path, $ORACLE_HOME). A zip install on
# Linux also needs libaio, and its run path set (patchelf --set-rpath '$ORIGIN')
# or LD_LIBRARY_PATH. A leading ~/ is your home directory.
# oracle_client_dir = "~/.local/opt/oracle/instantclient_23_26"
#
# [[sql.connection]]
# name = "reporting"                     # what --conn takes
# kind = "mssql"                         # or "oracle"
# host = "sql.contoso.example"
# port = 1433                            # default 1433 (mssql), 1521 (oracle)
# database = "contoso"                   # mssql only
# user = "app_reader"
# password_env = "CONTOSO_DB_PASSWORD"   # or password_cmd = "pass show contoso/db",
#                                        # or password = "..." (throwaway only)
# trust_cert = false                     # mssql only: accept a self-signed certificate
# encrypt = true                         # mssql only
# read_only = true                       # refuse every write on this connection
#
# [[sql.connection]]
# name = "ledger"
# kind = "oracle"
# host = "ora.contoso.example"
# service = "LEDGER"                     # oracle only: the service name
# user = "app_reader"
# password_cmd = "pass show contoso/ledger"
#
# read_only is a second line of defence; the real guard is a login that can
# only read.
