# The contoso world's config: what agent-cli reads when a trial runs against
# fixtures/world (scripts/trial-env.sh points AGENT_CLI_CONFIG here).
# Synthetic names only; nothing here reaches a real service.

[ado]
org = "contoso"
project = "Fabrikam"
team = "Fabrikam Team"

[confluence]
url = "https://wiki.contoso.example"
token_cmd = "echo stand-in"

[azure]
subscriptions = ["00000000-0000-4000-8000-000000005b01"]
vaults = ["kv-contoso-prod", "kv-contoso-staging"]
registries = ["contosoacr"]
search_services = ["srch-contoso-prod", "srch-contoso-dev"]

[[k8s.scope]]
name = "prod"
context = "aks-contoso-prod"
namespaces = ["web"]

[[k8s.scope]]
name = "staging"
context = "aks-contoso-staging"
namespaces = ["web"]

[[airflow.instance]]
name = "prod"
base_url = "https://airflow.contoso.example"
username = "agent"
password_cmd = "echo stand-in"
k8s_scope = "prod"
k8s_namespace = "web"
dags_repo = "airflow-dags:dags"

[[airflow.instance]]
name = "qa"
base_url = "https://airflow-qa.contoso.example"
username = "agent"
password_cmd = "echo stand-in"
k8s_scope = "staging"
k8s_namespace = "web"

# No sql recordings: the connection is here so airflow connection list can
# name it as sql_conn.
[[sql.connection]]
name = "reporting"
kind = "mssql"
host = "sql.contoso.example"
database = "reporting"
user = "agent"
password_cmd = "echo stand-in"

# No redis or Control-M recordings either: both are here so every domain is
# set up, as on a team's machines, and search and the overview show them
# (a domain not set up is left out of both).
[[redis.instance]]
name = "sessions"
host = "redis-sessions.contoso.example"
password_cmd = "echo stand-in"

[[controlm.instance]]
name = "prod"
base_url = "https://ctm.contoso.example:8443/automation-api"
username = "agent"
password_cmd = "echo stand-in"

[datadog]
site = "datadoghq.eu"
env = "prod"
token_cmd = "echo fixture-dd-token"

[keeper]
url = "https://keeper.contoso.example"
token_cmd = "echo stand-in"
