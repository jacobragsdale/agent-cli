[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/jacobragsdale/agent-cli"

[workspace.dependencies]
agent-cli-ado = { path = "crates/ado" }
agent-cli-confluence = { path = "crates/confluence" }
agent-cli-core = { path = "crates/core" }
agent-cli-sql = { path = "crates/sql" }
agent-cli-redis = { path = "crates/redis" }
agent-cli-azure = { path = "crates/azure" }
agent-cli-k8s = { path = "crates/k8s" }
agent-cli-airflow = { path = "crates/airflow" }
agent-cli-controlm = { path = "crates/controlm" }
agent-cli-dd = { path = "crates/dd" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
oracle = "0.6.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
schemars = { version = "1.2.1", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
signal-hook = "0.3.18"
strsim = "0.11.1"
tempfile = "3.27.0"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls"] }
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["rt", "net", "time"] }
tokio-postgres = { version = "0.7.18", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-util = { version = "0.7.19", features = ["compat"] }
toml = "0.9.12"
ureq = { version = "3.4.1", features = ["platform-verifier"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# panic stays "unwind": tiberius panics on some column types (sql_variant)
# and the sql crate catches that as a failed query.
lto = "thin"
strip = "symbols"
