[workspace]
resolver = "3"
members = ["crates/core", "crates/ado", "crates/sql", "crates/azure", "crates/k8s", "crates/dd", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/jacobragsdale/agent-cli"

[workspace.dependencies]
agent-cli-ado = { path = "crates/ado" }
agent-cli-core = { path = "crates/core" }
agent-cli-sql = { path = "crates/sql" }
agent-cli-azure = { path = "crates/azure" }
agent-cli-k8s = { path = "crates/k8s" }
agent-cli-dd = { path = "crates/dd" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
oracle = "0.6.3"
schemars = { version = "1.2.1", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
strsim = "0.11.1"
tempfile = "3.27.0"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls"] }
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["rt", "net", "time"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
toml = "0.9.12"
ureq = "3.4.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# panic stays "unwind": tiberius panics on some column types (sql_variant)
# and the sql crate catches that as a failed query.
lto = "thin"
strip = "symbols"
