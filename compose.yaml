# Local databases for the sql integration tests. Started and seeded by
# scripts/db-up.sh; the credentials are throwaway and localhost only (see
# config.test.toml).
#
# Licensing: MSSQL_PID=Developer selects the free SQL Server Developer
# edition, which Microsoft licenses for development and test use only --
# never for production. Oracle Database Free is free to use within its
# resource limits. ACCEPT_EULA=Y accepts the SQL Server EULA on your behalf.
# Postgres is under the PostgreSQL License.
name: agent-cli

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agent-cli-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Bench_Pass1!"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -C
        - -S
        - localhost
        - -U
        - sa
        - -P
        - Bench_Pass1!
        - -Q
        - select 1
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: agent-cli-oracle
    environment:
      ORACLE_PASSWORD: "Bench_Pass1!"
      APP_USER: bench
      APP_USER_PASSWORD: bench
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 90
      start_period: 30s

  # TLS on with the image's self-signed certificate, so both encrypt = true
  # (with trust_cert) and encrypt = false are tried. On 5433, so a Postgres
  # of your own on 5432 is left alone.
  postgres:
    image: postgres:18
    container_name: agent-cli-postgres
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: the image's first-run server listens only on its socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "bench", "-d", "bench"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

volumes:
  mssql-data:
  oracle-data:
  postgres-data:
