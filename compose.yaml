# Local databases for the sql integration tests. Started and seeded by
# scripts/db-up.sh; the credentials are throwaway and localhost only (see
# config.test.toml).
#
# Licensing: MSSQL_PID=Developer selects the free SQL Server Developer
# edition, which Microsoft licenses for development and test use only --
# never for production. Oracle Database Free is free to use within its
# resource limits. ACCEPT_EULA=Y accepts the SQL Server EULA on your behalf.
name: agent-cli

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agent-cli-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Bench_Pass1!"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -C
        - -S
        - localhost
        - -U
        - sa
        - -P
        - Bench_Pass1!
        - -Q
        - select 1
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: agent-cli-oracle
    environment:
      ORACLE_PASSWORD: "Bench_Pass1!"
      APP_USER: bench
      APP_USER_PASSWORD: bench
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 90
      start_period: 30s

volumes:
  mssql-data:
  oracle-data:
