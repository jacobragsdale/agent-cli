# Labeled search queries for redis, written as tasks an agent would type.
# The search gate in crates/cli reads every crates/*/search.toml.

# ---------- redis ----------

[[query]]
text = "find redis keys that start with session:"
expect = "redis key list"

[[query]]
text = "list the cache keys matching orders:*"
expect = "redis key list"

[[query]]
text = "which keys use the most memory in the redis cache"
expect = "redis key list"

[[query]]
text = "biggest keys in redis"
expect = "redis key list"

[[query]]
