# Labeled search queries, written as tasks an agent would type.
# Every new command adds at least two, for example:
#
#   [[query]]
#   text = "who approved PR 42"
#   expect = "ado pr get"
#
# CI fails when search puts the expected command first in fewer than 80% of
# queries, or in the top five in fewer than 95%.

# ---------- sql ----------

[[query]]
text = "run a select against the reporting database"
expect = "sql query run"

[[query]]
text = "execute a SQL statement on SQL Server"
expect = "sql query run"

[[query]]
text = "insert a row into an Oracle table"
expect = "sql query run"

[[query]]
text = "delete old rows with a sql script"
expect = "sql query run"

[[query]]
text = "time how long a query takes"
