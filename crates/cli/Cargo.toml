[package]
name = "agent-cli"
description = "One CLI that gives coding agents Azure DevOps, Azure, Kubernetes and SQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "agent-cli"
path = "src/main.rs"

[features]
# One feature per domain, all on by default. A team build picks its own:
# --no-default-features --features sql,airflow.
default = ["ado", "confluence", "kv", "acr", "aks", "aisearch", "arm", "net", "lake", "entra", "k8s", "sql", "redis", "airflow", "controlm", "dd", "keeper", "http"]
ado = ["dep:agent-cli-ado"]
confluence = ["dep:agent-cli-confluence"]
kv = ["dep:agent-cli-azure"]
acr = ["dep:agent-cli-azure"]
aks = ["dep:agent-cli-azure"]
aisearch = ["dep:agent-cli-azure"]
arm = ["dep:agent-cli-azure"]
net = ["dep:agent-cli-azure"]
lake = ["dep:agent-cli-azure"]
entra = ["dep:agent-cli-azure"]
k8s = ["dep:agent-cli-k8s"]
sql = ["dep:agent-cli-sql"]
redis = ["dep:agent-cli-redis"]
airflow = ["dep:agent-cli-airflow"]
controlm = ["dep:agent-cli-controlm"]
dd = ["dep:agent-cli-dd"]
keeper = ["dep:agent-cli-keeper"]
http = ["dep:agent-cli-http"]
# Trials on recorded worlds: AGENT_CLI_FIXTURES=<dir> replays <dir>/http/*.json
# instead of the network (see fixtures/world/README.md). Off by default and
# never in a release install.
fixtures = ["agent-cli-core/fixtures"]
# The config at AGENT_CLI_BUILTIN_CONFIG, built in (crates/core's config.rs).
builtin-config = ["agent-cli-core/builtin-config"]

[dependencies]
agent-cli-ado = { workspace = true, optional = true }
agent-cli-confluence = { workspace = true, optional = true }
agent-cli-core.workspace = true
agent-cli-sql = { workspace = true, optional = true }
agent-cli-redis = { workspace = true, optional = true }
agent-cli-azure = { workspace = true, optional = true }
agent-cli-k8s = { workspace = true, optional = true }
agent-cli-airflow = { workspace = true, optional = true }
agent-cli-controlm = { workspace = true, optional = true }
agent-cli-dd = { workspace = true, optional = true }
agent-cli-keeper = { workspace = true, optional = true }
agent-cli-http = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
