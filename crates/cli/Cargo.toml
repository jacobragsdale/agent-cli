[package]
name = "agent-cli"
description = "One CLI that gives coding agents Azure DevOps, Azure, Kubernetes and SQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "agent-cli"
path = "src/main.rs"

[features]
# Trials on recorded worlds: AGENT_CLI_FIXTURES=<dir> replays <dir>/http/*.json
# instead of the network (see fixtures/world/README.md). Off by default and
# never in a release install.
fixtures = ["agent-cli-core/fixtures"]

[dependencies]
agent-cli-ado.workspace = true
agent-cli-core.workspace = true
agent-cli-sql.workspace = true
agent-cli-azure.workspace = true
agent-cli-k8s.workspace = true
agent-cli-dd.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
