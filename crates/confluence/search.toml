# Labeled search queries for confluence, written as tasks an agent would type.
# The search gate in crates/cli reads every crates/*/search.toml. Every new
# command adds at least two, for example:
#
#   [[query]]
#   text = "read the release notes page in confluence"
#   expect = "confluence page get"
#
# CI fails when search puts the expected command first in fewer than 80% of
# queries, or in the top five in fewer than 95%, across all crates.

# ---------- confluence ----------

[[query]]
text = "which confluence spaces are there"
expect = "confluence space list"

[[query]]
text = "find the engineering wiki space key"
expect = "confluence space list"

[[query]]
text = "find the confluence runbook for etl_nightly"
expect = "confluence page list"

[[query]]
text = "search the wiki for pages about the orders indexer"
expect = "confluence page list"

[[query]]
text = "wiki pages labeled runbook changed this week"
expect = "confluence page list"

[[query]]
text = "read the release notes page in confluence"
expect = "confluence page get"

[[query]]
text = "show the section of the runbook about a missing customer_id"
expect = "confluence page get"

[[query]]
text = "open this confluence page url as markdown"
expect = "confluence page get"

[[query]]
text = "publish a postmortem page to confluence from a markdown file"
expect = "confluence page create"

[[query]]
text = "create a new wiki page under runbooks"
expect = "confluence page create"

[[query]]
text = "add a rollback section to the confluence runbook"
expect = "confluence page update"

[[query]]
text = "rename a wiki page and move it under another parent"
expect = "confluence page update"

[[query]]
text = "edit the body of a confluence page"
expect = "confluence page update"

[[query]]
text = "leave a comment on the release notes wiki page"
expect = "confluence page comment"

[[query]]
text = "reply to a confluence comment"
expect = "confluence page comment"

[[query]]
text = "delete the old confluence page"
expect = "confluence page delete"

[[query]]
text = "move a wiki page to the trash"
expect = "confluence page delete"

[[query]]
text = "what pages are under Runbooks"
expect = "confluence tree get"

[[query]]
text = "show the confluence page hierarchy of the space"
expect = "confluence tree get"

[[query]]
text = "unresolved comments on the release notes page"
expect = "confluence comment list"

[[query]]
text = "list the inline comments on a confluence page and the text each points at"
expect = "confluence comment list"

[[query]]
text = "resolve the inline comment on the wiki page"
expect = "confluence comment update"

[[query]]
text = "reopen a resolved confluence comment"
expect = "confluence comment update"

[[query]]
text = "which files are attached to the release notes page"
expect = "confluence attachment list"

[[query]]
text = "list confluence page attachments"
expect = "confluence attachment list"

[[query]]
text = "download the file attached to the wiki page"
expect = "confluence attachment get"

[[query]]
text = "save the changelog attachment from confluence to a file"
expect = "confluence attachment get"

[[query]]
text = "upload a file to a confluence page"
expect = "confluence attachment create"

[[query]]
text = "attach the csv to the wiki page"
expect = "confluence attachment create"

[[query]]
text = "who edited the runbook this week"
expect = "confluence version list"

[[query]]
text = "confluence page history: what changed and who changed it"
expect = "confluence version list"

[[query]]
text = "list the revisions of a wiki page"
expect = "confluence version list"
