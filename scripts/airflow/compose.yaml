# A throwaway Airflow 2.9.3 for crates/cli/tests/live_airflow.rs, trimmed
# from the official docker-compose.yaml: LocalExecutor and postgres (no
# Celery, no redis), the webserver on 127.0.0.1 only, postgres unpublished.
# Start it with scripts/airflow-up.sh.
name: agent-cli-airflow

x-airflow: &airflow
  image: apache/airflow:2.9.3
  environment: &env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: 'Xq8V1H0b3oQ0bX5xQx6a8m9y0C8d2V3l5t7n9p1r3s4='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__SECRET_KEY: agent-cli-live-airflow
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '10'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '10'
    AIRFLOW__SCHEDULER__PARSING_CLEANUP_INTERVAL: '10'
    AIRFLOW__SCHEDULER__STALE_DAG_THRESHOLD: '10'
  volumes:
    - .:/opt/airflow/e2e:ro
    - dags:/opt/airflow/dags
    - logs:/opt/airflow/logs
  user: "50000:0"
  depends_on: &depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        chown -R 50000:0 /opt/airflow/dags /opt/airflow/logs
        cp /opt/airflow/e2e/dags/*.py /opt/airflow/dags/
        exec /entrypoint airflow version
    environment:
      <<: *env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    user: "0:0"

  airflow-webserver:
    <<: *airflow
    command: webserver
    environment:
      <<: *env
      # Basic and session by default, as the official compose; session only
      # (the 2.x default) with AIRFLOW_AUTH=session scripts/airflow-up.sh,
      # which restarts only the webserver.
      AIRFLOW__API__AUTH_BACKENDS: ${AIRFLOW_AUTH_BACKENDS:-airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session}
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 5s
      retries: 60
    depends_on:
      <<: *depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      <<: *depends
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow
    command: triggerer
    depends_on:
      <<: *depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  db:
  dags:
  logs:
