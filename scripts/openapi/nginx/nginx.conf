# TLS in front of fastapi, one port per kind of certificate. The script
# writes the certificates to target/openapi-up/, mounted at /certs. Each
# server listens on the port the host publishes it on, so through the proxy
# https://api.contoso.test:58443 reaches the same server as
# https://localhost:58443 does from the host.
events {}

http {
    access_log off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;

    # valid: the test CA's certificate for localhost, 127.0.0.1, api.contoso.test
    server {
        listen 58443 ssl;
        ssl_certificate /certs/server.pem;
        ssl_certificate_key /certs/server-key.pem;
        location / { proxy_pass http://fastapi:8000; }
    }

    # mTLS: the same certificate, and a client certificate from the test CA
    server {
        listen 58444 ssl;
        ssl_certificate /certs/server.pem;
        ssl_certificate_key /certs/server-key.pem;
        ssl_client_certificate /certs/ca.pem;
        ssl_verify_client on;
        location / { proxy_pass http://fastapi:8000; }
    }

    # expired in 2021, from the test CA
    server {
        listen 58445 ssl;
        ssl_certificate /certs/expired.pem;
        ssl_certificate_key /certs/server-key.pem;
        location / { proxy_pass http://fastapi:8000; }
    }

    # self-signed, not from the test CA
    server {
        listen 58446 ssl;
        ssl_certificate /certs/self-signed.pem;
        ssl_certificate_key /certs/server-key.pem;
        location / { proxy_pass http://fastapi:8000; }
    }

    # from the test CA, but only for other.contoso.test
    server {
        listen 58447 ssl;
        ssl_certificate /certs/wrong-host.pem;
        ssl_certificate_key /certs/server-key.pem;
        location / { proxy_pass http://fastapi:8000; }
    }

    # the test CA's own certificate (CA:TRUE) served as the leaf
    server {
        listen 58448 ssl;
        ssl_certificate /certs/ca.pem;
        ssl_certificate_key /certs/ca-key.pem;
        location / { proxy_pass http://fastapi:8000; }
    }

    # a leaf from an intermediate CA, sent with the intermediate
    server {
        listen 58449 ssl;
        ssl_certificate /certs/chain.pem;
        ssl_certificate_key /certs/server-key.pem;
        location / { proxy_pass http://fastapi:8000; }
    }
}
