# The authenticating proxy: Basic agent:proxy-pass (the script writes the
# password file). It resolves the compose service names, which the host
# cannot, so http://fastapi:8000/ is reachable only through it, and it
# tunnels CONNECT to the TLS ports at api.contoso.test (the tls service).
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm contoso-proxy
acl authed proxy_auth REQUIRED
acl tls_ports port 58443-58449
acl CONNECT method CONNECT
http_access deny CONNECT !tls_ports
http_access allow authed
http_access deny all
http_port 3128
via on
forwarded_for on
cache deny all
# A recreated container comes back on a new address.
positive_dns_ttl 1 seconds
negative_dns_ttl 1 seconds
pid_filename none
shutdown_lifetime 0 seconds
